}

// ── MODAL ──
var modalIdx = -1;

function abrirModal(idx) {
  var p = todosLosPedidos[idx];
  if (!p) return;
  modalIdx = idx;

  document.getElementById('modalCod').textContent      = p.cod;
  document.getElementById('modalTipo').textContent     = p.tipo;
  document.getElementById('modalTipo').className       = 'modal-tipo ' + p.tipo;
  document.getElementById('modalSucursal').textContent = p.sucursal;
  document.getElementById('modalFecha').textContent    = p.fecha ? p.fecha.substring(8,10)+'/'+p.fecha.substring(5,7)+'/'+p.fecha.substring(0,4) : '—';
  document.getElementById('modalTalle').textContent    = p.talle || '—';
  document.getElementById('modalColor').textContent    = p.color || '—';
  document.getElementById('modalCantidad').textContent = p.cantidad;
  document.getElementById('modalEncargado').textContent= p.encargado;
  document.getElementById('modalObs').textContent      = p.obs || 'Sin observación';
  document.getElementById('modalSolObs').value         = '';
  document.getElementById('modalSolBox').classList.remove('show');
  // Mostrar observación de resolución si existe
  var obsSolWrap = document.getElementById('modalObsSolWrap');
  var obsSolEl   = document.getElementById('modalObsSol');
  if (p.obsExtra && p.obsExtra.trim()) {
    obsSolEl.textContent = p.obsExtra;
    obsSolWrap.style.display = '';
  } else {
    obsSolWrap.style.display = 'none';
  }

  // Armar botones según estado
  var esSol = p.estado === 'Solucionado';
  var actions = document.getElementById('modalActions');
  if (!esSol) {
    actions.innerHTML =
      '<button class="modal-btn sol"  data-estado="Solucionado" onclick="modalAccionBtn(this)">✓ Solucionado</button>' +
      '<button class="modal-btn proc" data-estado="EnProceso"   onclick="modalAccionBtn(this)">⏳ En proceso</button>' +
      '<button class="modal-btn rev"  data-estado="Revisar"      onclick="modalAccionBtn(this)">⚠ Revisar</button>' +
      '<button class="modal-btn cancelar" onclick="cerrarModal()">Cancelar</button>';
  } else {
    actions.innerHTML =
      '<button class="modal-btn reabrir" data-estado="SinVer"    onclick="modalAccionBtn(this)">↩ Reabrir</button>' +
      '<button class="modal-btn cancelar" onclick="cerrarModal()">Cancelar</button>';
  }

  document.getElementById('modalOverlay').classList.add('open');
}

function modalAccionBtn(btn) {
  modalAccion(btn.getAttribute("data-estado"));
}

function modalAccion(nuevoEstado) {
  if (nuevoEstado === 'Solucionado') {
    // Mostrar campo de observación antes de confirmar
    var solBox = document.getElementById('modalSolBox');
    if (!solBox.classList.contains('show')) {
      solBox.classList.add('show');
      // Cambiar botón a "Confirmar"
      var btn = document.querySelector('.modal-btn.sol');
      if (btn) { btn.textContent = '✓ Confirmar'; btn.removeAttribute('data-estado'); btn.onclick = confirmarSolucionado; }
      document.getElementById('modalSolObs').focus();
      return;
    }
  }
  ejecutarCambioEstado(nuevoEstado, '');
}

function confirmarSolucionado() {
  var obs = document.getElementById('modalSolObs').value.trim();
  ejecutarCambioEstado('Solucionado', obs);
}

async function ejecutarCambioEstado(nuevoEstado, obsExtra) {
  var idx = modalIdx; // guardar índice antes de cerrar el modal
  var p = todosLosPedidos[idx];
  if (!p) return;
  var estadoAnterior = p.estado; // guardar para revertir si falla
  cerrarModal();

  // UI optimista — actualizar pantalla inmediatamente sin esperar servidor
  todosLosPedidos[idx].estado = nuevoEstado;
  if (obsExtra) todosLosPedidos[idx].obsExtra = obsExtra;
  actualizarStats();
  renderPanel();
  var labels = { SinVer:'Sin ver', EnProceso:'En proceso', Revisar:'Revisar', Solucionado:'Solucionado' };
  toast('✓ ' + (labels[nuevoEstado] || nuevoEstado), 'success');

  // Guardar en servidor en segundo plano
  try {
    var url = API_URL + '?accion=actualizarEstado' +
      '&id='      + encodeURIComponent(p.id) +
      '&cod='     + encodeURIComponent(p.cod) +
      '&talle='   + encodeURIComponent(p.talle || '') +
      '&estado='  + encodeURIComponent(nuevoEstado) +
      '&obsExtra='+ encodeURIComponent(obsExtra || '');
    var resp = await fetch(url);
    var data = await resp.json();
    if (!data.ok) {
      // Revertir si el servidor falló
      todosLosPedidos[idx].estado = estadoAnterior;
      actualizarStats();
      renderPanel();
      toast('⚠ Error al guardar: ' + (data.error || 'desconocido'), 'error');
    }
  } catch(e) {
    // Revertir si no hubo conexión
    todosLosPedidos[idx].estado = estadoAnterior;
    actualizarStats();
    renderPanel();
    toast('⚠ Sin conexión — cambio revertido', 'error');
  }
}

function cerrarModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  modalIdx = -1;
}

function cerrarModalOverlay(e) {
  if (e.target === document.getElementById('modalOverlay')) cerrarModal();
}

function buildTablaHTML(lista) {
  var html = '<div class="table-wrap"><table>';
  html += '<thead><tr>';
  html += '<th>Fecha</th><th>Hora</th><th>Tipo</th><th>COD</th>';
  html += '<th>Talle</th><th>Color</th><th>Cant.</th>';
  html += '<th>Observación</th><th>Encargado</th><th>Estado</th>';
  html += '</tr></thead><tbody>';
  lista.forEach(function(p) { html += buildFila(p); });
  html += '</tbody></table></div>';
  return html;
}

function renderPanel() {
  if (vistaActual === 'cajas') return;
  var pendientes   = filtrar(false);
  var solucionados = filtrar(true);

  var htmlPend = '';
  if (pendientes.length === 0) {
    htmlPend = '<div class="empty-state">📭 Sin artículos pendientes.</div>';
  } else {
    var grupos = {};
    SUCURSALES.forEach(function(s) { grupos[s] = []; });
    pendientes.forEach(function(p) {
      if (!grupos[p.sucursal]) grupos[p.sucursal] = [];
      grupos[p.sucursal].push(p);
    });
    SUCURSALES.forEach(function(suc) {
      var lista = grupos[suc];
      if (!lista || lista.length === 0) return;
      var sinRes = lista.filter(function(p) {
        return p.estado === 'SinVer' || p.estado === 'Revisar';
      }).length;
      htmlPend += '<div class="sucursal-block">';
      htmlPend += '<div class="sucursal-header">';
      htmlPend += '<div class="suc-stripe" data-suc="' + suc + '"></div>';
      htmlPend += '<span class="suc-nombre">' + suc + '</span>';
      htmlPend += '<span class="suc-count">' + lista.length + ' artículo' + (lista.length !== 1 ? 's' : '') + '</span>';
      if (sinRes > 0) htmlPend += '<span class="suc-alerta">' + sinRes + ' sin resolver</span>';
      htmlPend += '</div>';
      htmlPend += '<div class="table-card">' + buildTablaHTML(lista) + '</div>';
      htmlPend += '</div>';
    });
  }
  document.getElementById('panelPendientes').innerHTML = htmlPend;

  var htmlSol = '';
  if (solucionados.length > 0) {
    htmlSol += '<div class="section-label" onclick="toggleSolucionados()">';
    htmlSol += '<span class="section-label-text">Solucionados</span>';
    htmlSol += '<span class="section-label-count">' + solucionados.length + '</span>';
    htmlSol += '<button class="section-toggle" id="solToggleBtn">▼ mostrar</button>';
    htmlSol += '</div>';
    htmlSol += '<div id="solContent" class="sol-collapsed">';
    // Agrupar solucionados por sucursal
    var gruposSol = {};
    SUCURSALES.forEach(function(s){ gruposSol[s] = []; });
    solucionados.forEach(function(p){
      if (!gruposSol[p.sucursal]) gruposSol[p.sucursal] = [];
      gruposSol[p.sucursal].push(p);
    });
    SUCURSALES.forEach(function(suc){
      var lista = gruposSol[suc];
      if (!lista || lista.length === 0) return;
      htmlSol += '<div class="sucursal-block">';
      htmlSol += '<div class="sucursal-header">';
      htmlSol += '<div class="suc-stripe" data-suc="' + suc + '"></div>';
      htmlSol += '<span class="suc-nombre">' + suc + '</span>';
      htmlSol += '<span class="suc-count">' + lista.length + ' solucionado' + (lista.length !== 1 ? 's' : '') + '</span>';
      htmlSol += '</div>';
      htmlSol += '<div class="table-card">' + buildTablaHTML(lista) + '</div>';
      htmlSol += '</div>';
    });
    htmlSol += '</div>';
  }
  document.getElementById('panelSolucionados').innerHTML = htmlSol;
}

function toggleSolucionados() {
  var el  = document.getElementById('solContent');
  var btn = document.getElementById('solToggleBtn');
  if (!el) return;
  var collapsed = el.classList.toggle('sol-collapsed');
  if (btn) btn.textContent = collapsed ? '▼ mostrar' : '▲ ocultar';
}

// ── CAJAS ──
function irHoyCajas() {
  var hoy = new Date();
  document.getElementById('cajasfecha').value =
    hoy.getFullYear() + '-' +
    String(hoy.getMonth()+1).padStart(2,'0') + '-' +

async function cargarCajas() {
  var fecha = document.getElementById('cajasfecha').value;
  document.getElementById('cajasGrid').innerHTML =
    '<div class="loading-state" style="grid-column:1/-1"><div class="spinner"></div><p>Cargando...</p></div>';

    var resp = await fetch(API_URL + '?accion=obtenerCajas&fecha=' + encodeURIComponent(fecha));
    var data = await resp.json();
    if (data.ok) { renderCajas(data.cajas); }
    else {
      document.getElementById('cajasGrid').innerHTML =
        '<div class="empty-state" style="grid-column:1/-1">⚠ ' + (data.error || 'Error') + '</div>';
    }
  } catch(e) {
    document.getElementById('cajasGrid').innerHTML =
      '<div class="empty-state" style="grid-column:1/-1">⚠ Error de conexión</div>';
  }
}

// Guardar cajas globalmente para el modal
var cajasData = [];

function renderCajas(cajas) {
  cajasData = cajas;
  var cerro     = cajas.filter(function(c){ return !c.sinCierre; }).length;
  var sinCierre = cajas.filter(function(c){ return  c.sinCierre; }).length;
  var alertas   = cajas.filter(function(c){ return  c.alerta; }).length;
  var elCerro = document.getElementById('cajaStat-cerro');
  var elSin   = document.getElementById('cajaStat-sinCierre');
  var elAl    = document.getElementById('cajaStat-alertas');
  if (elCerro) elCerro.textContent = cerro;
  if (elSin)   elSin.textContent   = sinCierre;
  if (elAl)    elAl.textContent    = alertas;
  var badgeAlertas = document.getElementById('badge-alertas');
  if (badgeAlertas) {
    badgeAlertas.style.display = alertas > 0 ? '' : 'none';
    if (alertas > 0) badgeAlertas.textContent = alertas;
  }

  var html = '';
  cajas.forEach(function(c, idx) {
    if (c.sinCierre) {
      html += '<div class="caja-card sin-cierre" data-suc="' + c.sucursal + '" onclick="abrirModalCaja(' + idx + ')">';
      html += '<div class="caja-card-header"><div><div class="caja-suc">' + c.sucursal + '</div></div>';
      html += '<div class="caja-status-dot sin-cierre"></div></div>';
      html += '<div class="caja-sin-cierre-msg">Sin cierre registrado</div></div>';
      return;
    }
    var clase = c.alerta ? 'alerta' : 'ok';
    // Formatear fecha dd/mm
    var fechaDisplay = c.fecha ? c.fecha.substring(8,10)+'/'+c.fecha.substring(5,7) : '';
    html += '<div class="caja-card ' + clase + '" data-suc="' + c.sucursal + '" onclick="abrirModalCaja(' + idx + ')">';
    html += '<div class="caja-card-header"><div>';
    html += '<div class="caja-suc" style="font-family:var(--font-display);letter-spacing:1px">' + c.sucursal + '</div>';
    html += '<div class="caja-meta">Cierre: <span>' + (c.hora||'—') + '</span>' + (fechaDisplay ? ' · ' + fechaDisplay : '') + '</div>';
    html += '<div class="caja-meta">Encargado: <span>' + (c.encargado||'—') + '</span></div>';
    html += '</div><div class="caja-status-dot ' + clase + '"></div></div>';
    html += '<div class="caja-checks">';
    html += checkRow('Remitos cargados',    c.remitos,    false);
    html += checkRow('Salidas registradas', c.salidas,    false);
    html += checkRow('Diferencia cupón',    c.diferencia, true);
    html += '</div>';
    if (c.ausente || c.franquero || c.mantenimiento) {
      html += '<div class="caja-extras">';
      if (c.ausente) html += extraRow('👤', 'Ausente: <strong>' + c.ausente + '</strong>');
      if (c.franquero) {
        // Cada franquero está separado por " | "
        var franks = c.franquero.split(' | ');
        franks.forEach(function(f) {
          if (!f.trim()) return;
          // Formato: "Nombre (Eval)"
          var match = f.match(/^(.+?)\s*\((.+?)\)$/);
          if (match) {
            var nombre = match[1].trim();
            var eval_  = match[2].trim();
            var evalColor = eval_ === 'Si' ? '#16a34a' : eval_ === 'No' ? '#dc2626' : '#d97706';
            var evalLabel = eval_ === 'Si' ? '👍 Apto' : eval_ === 'No' ? '👎 No apto' : '😐 Regular';
            html += '<div class="caja-extra-item">';
            html += '<span class="caja-extra-icon">⭐</span>';
            html += '<span class="caja-extra-text"><strong>' + nombre + '</strong> · <span style="color:' + evalColor + ';font-weight:600">' + evalLabel + '</span></span>';
            html += '</div>';
          } else {
            html += extraRow('⭐', f);
          }
        });
      }
      if (c.mantenimiento) html += extraRow('🔧', '<em>' + c.mantenimiento + '</em>');
      html += '</div>';
    }
    html += '</div>';
  });
  document.getElementById('cajasGrid').innerHTML = html;
}

function franqueroApto(val) {
  if (!val) return '';
  if (val === 'Si') return ' · <span style="color:#16a34a;font-weight:600">Apto ✓</span>';
  if (val === 'No') return ' · <span style="color:#dc2626;font-weight:600">No apto ✗</span>';
  return ' · <span style="color:#d97706;font-weight:600">Regular ~</span>';
}



function abrirModalCaja(idx) {
  var c = cajasData[idx];
  if (!c) return;

  var fechaDisplay = c.fecha
    ? c.fecha.substring(8,10)+'/'+c.fecha.substring(5,7)+'/'+c.fecha.substring(0,4)
    : '—';

  document.getElementById('mcSucursal').textContent = c.sucursal;
  document.getElementById('mcFecha').textContent    = 'Cierre del ' + fechaDisplay;
  document.getElementById('mcEncargado').textContent= c.encargado || '—';
  document.getElementById('mcHora').textContent     = c.hora || '—';

  // Operativo
  var checks = '';
  checks += informeCheckRow('Remitos cargados',    c.remitos,    false);
  checks += informeCheckRow('Salidas registradas', c.salidas,    false);
  checks += informeCheckRow('Diferencia de cupón', c.diferencia, true);
  document.getElementById('mcChecks').innerHTML = checks;

  // Novedades
  var extras = '';
  if (c.ausente) {
    extras += '<div class="informe-novedad-item">';
    extras += '<span class="informe-novedad-icon">👤</span>';
    extras += '<div class="informe-novedad-content">';
    extras += '<div class="informe-novedad-label">Ausente</div>';
    extras += '<div class="informe-novedad-val">' + c.ausente + '</div>';
    extras += '</div></div>';
  }
  if (c.franquero) {
    var franks = c.franquero.split(' | ');
    franks.forEach(function(f) {
      if (!f.trim()) return;
      var match = f.match(/^(.+?)\s*\((.+?)\)$/);
      var nombre = match ? match[1].trim() : f.trim();
      var evalVal = match ? match[2].trim() : '';
      var evalClass = evalVal === 'Si' ? 'apto' : evalVal === 'No' ? 'no-apto' : 'regular';
      var evalLabel = evalVal === 'Si' ? '👍 Apto' : evalVal === 'No' ? '👎 No apto' : '😐 Regular';
      extras += '<div class="informe-novedad-item">';
      extras += '<span class="informe-novedad-icon">⭐</span>';
      extras += '<div class="informe-novedad-content">';
      extras += '<div class="informe-novedad-label">Franquero/a</div>';
      extras += '<div class="informe-novedad-val">' + nombre + '</div>';
      if (evalVal) extras += '<span class="informe-novedad-eval ' + evalClass + '">' + evalLabel + '</span>';
      extras += '</div></div>';
    });
  }
  if (c.mantenimiento) {
    extras += '<div class="informe-novedad-item">';
    extras += '<span class="informe-novedad-icon">🔧</span>';
    extras += '<div class="informe-novedad-content">';
    extras += '<div class="informe-novedad-label">Mantenimiento</div>';
    extras += '<div class="informe-novedad-val">' + c.mantenimiento + '</div>';
    extras += '</div></div>';
  }

  document.getElementById('mcExtras').innerHTML = extras ||
    '<div class="informe-sin-novedades">Sin novedades registradas</div>';

  document.getElementById('modalCajaOverlay').classList.add('open');
}

function informeCheckRow(label, val, invertido) {
  var esOk  = invertido ? (val === 'No' || val === '') : (val === 'Si');
  var esBad = invertido ? (val === 'Si') : (val === 'No');
  var color = esOk ? '#16a34a' : (esBad ? '#dc2626' : '#a0a09a');
  var texto = val === 'Si' ? '✓ Sí' : val === 'No' ? '✗ No' : '—';
  return '<div class="informe-check-row">' +
    '<span class="informe-check-label">' + label + '</span>' +
    '<span style="color:' + color + ';font-weight:600">' + texto + '</span>' +
    '</div>';
}

function imprimirInforme() { window.print(); }

function cerrarModalCaja() {
  document.getElementById('modalCajaOverlay').classList.remove('open');
}
function cerrarModalCajaOverlay(e) {
  if (e.target === document.getElementById('modalCajaOverlay')) cerrarModalCaja();
}

function checkRowModal(label, val, invertido) {
  var esOk  = invertido ? (val === 'No' || val === '') : (val === 'Si');
  var esBad = invertido ? (val === 'Si') : (val === 'No');
  var clase = esOk ? 'ok' : (esBad ? 'bad' : 'neutral');
  var texto = val === 'Si' ? '✓ Sí' : val === 'No' ? '✗ No' : '—';
  return '<div class="caja-check-row">' +
    '<span class="caja-check-label">' + label + '</span>' +
    '<span class="caja-check-val ' + clase + '">' + texto + '</span></div>';
}

function checkRow(label, val, invertido) {
  var esOk  = invertido ? (val === 'No' || val === '') : (val === 'Si');
  var esBad = invertido ? (val === 'Si') : (val === 'No');
  var clase = esOk ? 'ok' : (esBad ? 'bad' : 'neutral');
  var texto = val === 'Si' ? '✓ Sí' : val === 'No' ? '✗ No' : '—';
  return '<div class="caja-check-row" style="padding:3px 0;font-size:12px">' +
    '<span class="caja-check-label" style="color:var(--gray-600)">' + label + '</span>' +
    '<span class="caja-check-val ' + clase + '">' + texto + '</span></div>';
}

function extraRow(icon, text) {
  return '<div class="caja-extra-row">' +
    '<span class="caja-extra-icon">' + icon + '</span>' +
    '<span class="caja-extra-text">' + text + '</span></div>';
}

function toast(msg, tipo) {
  var t = document.getElementById('dashToast');
  t.textContent = msg;
