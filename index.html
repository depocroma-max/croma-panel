<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel Rotación · Croma</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --rojo:#8B1A1A;
  --rojo-oscuro:#6B1212;
  --rojo-claro:#FDF2F2;
  --rojo-borde:#F0D0D0;
  --rojo-acento:#B22222;
  --rojo-suave:#FAE8E8;
}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0ecec;color:#222;min-height:100vh}

/* CONFIG BANNER — solo visible hasta que se configure la URL */
.config-banner{background:#fef3c7;border-bottom:1px solid #fbbf24;padding:.75rem 1.5rem;font-size:13px;color:#92400e;display:flex;align-items:center;gap:10px}
.config-banner.hidden{display:none}
.config-banner input{flex:1;padding:6px 10px;border:1px solid #fbbf24;border-radius:6px;font-size:13px;font-family:inherit;background:#fff}
.config-banner button{padding:6px 14px;background:#92400e;color:#fff;border:none;border-radius:6px;font-size:13px;cursor:pointer;white-space:nowrap}

.top-bar{background:var(--rojo);padding:.875rem 1.5rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(139,26,26,.3)}
.top-bar h1{color:#fff;font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px}
.fecha-badge{background:rgba(255,255,255,.18);color:#fff;font-size:12px;padding:4px 12px;border-radius:20px;border:1px solid rgba(255,255,255,.3)}
.btn-top{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:6px 14px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .2s;text-decoration:none;font-family:inherit}
.btn-top:hover{background:rgba(255,255,255,.28)}

.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:1.25rem 1.5rem}
.stat{background:#fff;border-radius:10px;border:1px solid #e8dede;padding:.875rem 1rem;box-shadow:0 1px 3px rgba(139,26,26,.06)}
.stat-label{font-size:11px;color:#888;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.stat-val{font-size:24px;font-weight:700;color:#222}
.stat-val.pend{color:#b45309}
.stat-val.proc{color:#1D9E75}
.stat-val.env{color:#185FA5}

.filters{padding:0 1.5rem .875rem;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select,.filters input{
  padding:7px 12px;border:1px solid #ddd;border-radius:8px;
  font-size:13px;background:#fff;color:#222;font-family:inherit
}
.filters input{min-width:180px}
.filters select:focus,.filters input:focus{outline:none;border-color:var(--rojo)}

.badge-tipo{padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700}
.badge-tipo.PEDIDO{background:#fef3c7;color:#92400e}
.badge-tipo.REPOSICION{background:#dbeafe;color:#1e40af}

.suc-section{margin:0 1.5rem 1.25rem;background:#fff;border-radius:12px;border:1px solid #e8dede;overflow:hidden;box-shadow:0 1px 4px rgba(139,26,26,.06)}
.suc-header{padding:.875rem 1.25rem;background:var(--rojo-claro);border-bottom:1px solid var(--rojo-borde);display:flex;align-items:center;gap:10px}
.suc-badge{background:var(--rojo);color:#fff;font-size:12px;font-weight:700;padding:4px 12px;border-radius:20px}
.suc-counts{font-size:12px;color:#888}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{padding:8px 12px;text-align:left;font-size:11px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--rojo-borde);white-space:nowrap;background:#fffafa}
tbody tr{border-bottom:1px solid #faf0f0;transition:background .15s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--rojo-claro)}
td{padding:9px 12px;vertical-align:middle}
.cod{font-family:monospace;font-size:12px;font-weight:700;color:var(--rojo);background:var(--rojo-suave);padding:2px 6px;border-radius:5px}
.hora{color:#aaa;font-size:12px;white-space:nowrap}
.encargado{color:#888;font-size:12px}

.badge-estado{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.badge-estado.Pendiente{background:#fef3c7;color:#92400e}
.badge-estado.Procesado{background:#d1fae5;color:#065f46}
.badge-estado.Enviado{background:#dbeafe;color:#1e40af}

.actions{display:flex;gap:5px;flex-wrap:nowrap}
.btn-accion{padding:5px 10px;border-radius:7px;font-size:11px;font-weight:600;border:1px solid;cursor:pointer;white-space:nowrap;transition:all .15s;background:#fff;font-family:inherit}
.btn-accion.proc{border-color:#1D9E75;color:#1D9E75}
.btn-accion.proc:hover{background:#d1fae5}
.btn-accion.env{border-color:#185FA5;color:#185FA5}
.btn-accion.env:hover{background:#dbeafe}

.empty{text-align:center;padding:3rem 1.5rem;color:#aaa}
.loading{text-align:center;padding:3rem;color:var(--rojo)}
.spinner{display:inline-block;width:24px;height:24px;border:3px solid var(--rojo-borde);border-top-color:var(--rojo);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 22px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;white-space:nowrap}
.toast.show{opacity:1}
.toast.ok{background:#1D9E75}
.toast.err{background:var(--rojo-acento)}

@media(max-width:600px){
  .stats-bar{grid-template-columns:1fr 1fr}
  .filters{flex-direction:column;align-items:stretch}
  .filters input,.filters select{width:100%}
  .suc-section{margin:0 .75rem 1rem}
}
</style>
</head>
<body>

<!-- Banner de configuración — se oculta una vez guardada la URL -->
<div class="config-banner" id="config-banner">
  ⚙️ <strong>Primera vez:</strong> Pegá la URL de tu Apps Script y guardá.
  <input type="text" id="input-url" placeholder="https://script.google.com/macros/s/TU_ID/exec">
  <button onclick="guardarURL()">Guardar URL</button>
</div>

<div class="top-bar">
  <h1>🔄 Panel Rotación · Croma</h1>
  <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
    <span class="fecha-badge" id="fecha-hoy"></span>
    <button class="btn-top" onclick="cargarDatos()">↻ Actualizar</button>
    <button class="btn-top" onclick="cambiarURL()" title="Cambiar URL de Apps Script">⚙</button>
  </div>
</div>

<div class="stats-bar">
  <div class="stat"><div class="stat-label">Artículos hoy</div><div class="stat-val" id="stat-total">—</div></div>
  <div class="stat"><div class="stat-label">Pendientes</div><div class="stat-val pend" id="stat-pend">—</div></div>
  <div class="stat"><div class="stat-label">Procesados</div><div class="stat-val proc" id="stat-proc">—</div></div>
  <div class="stat"><div class="stat-label">Enviados</div><div class="stat-val env" id="stat-env">—</div></div>
</div>

<div class="filters">
  <select id="filtro-suc" onchange="renderPanel()">
    <option value="">Todas las sucursales</option>
    <option>01 PASEO</option>
    <option>05 WAVE</option>
    <option>09 CIPO SAN MARTIN</option>
    <option>10 PERITO MORENO</option>
    <option>12 CENTENARIO</option>
    <option>14 ROCA</option>
  </select>
  <select id="filtro-tipo" onchange="renderPanel()">
    <option value="">Pedidos y Reposiciones</option>
    <option value="PEDIDO">Solo Pedidos</option>
    <option value="REPOSICION">Solo Reposiciones</option>
  </select>
  <select id="filtro-estado" onchange="renderPanel()">
    <option value="">Todos los estados</option>
    <option value="Pendiente">Pendiente</option>
    <option value="Procesado">Procesado</option>
    <option value="Enviado">Enviado</option>
  </select>
  <input type="text" id="filtro-cod" placeholder="Buscar COD..." oninput="renderPanel()">
</div>

<div id="panel-body">
  <div class="empty">Configurá la URL de tu Apps Script para comenzar.</div>
</div>

<div class="toast" id="toast"></div>

<script>
var SUCURSALES_ORDEN = ['01 PASEO','05 WAVE','09 CIPO SAN MARTIN','10 PERITO MORENO','12 CENTENARIO','14 ROCA'];
var todosLosPedidos = [];
var APPS_SCRIPT_URL = localStorage.getItem('croma_api_url') || '';

// Init
(function(){
  var hoy = new Date();
  var dias  = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  var meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  document.getElementById('fecha-hoy').textContent =
    dias[hoy.getDay()]+' '+hoy.getDate()+' '+meses[hoy.getMonth()]+' '+hoy.getFullYear();

  if (APPS_SCRIPT_URL) {
    document.getElementById('config-banner').classList.add('hidden');
    cargarDatos();
  } else {
    document.getElementById('input-url').value = '';
  }
})();

function guardarURL() {
  var url = document.getElementById('input-url').value.trim();
  if (!url || !url.startsWith('https://script.google.com')) {
    mostrarToast('⚠ URL inválida — debe empezar con https://script.google.com', 'err');
    return;
  }
  APPS_SCRIPT_URL = url;
  localStorage.setItem('croma_api_url', url);
  document.getElementById('config-banner').classList.add('hidden');
  mostrarToast('✓ URL guardada', 'ok');
  cargarDatos();
}

function cambiarURL() {
  document.getElementById('config-banner').classList.remove('hidden');
  document.getElementById('input-url').value = APPS_SCRIPT_URL;
  document.getElementById('input-url').focus();
}

async function apiCall(accion, params) {
  params = params || {};
  params.accion = accion;
  var qs = Object.keys(params).map(function(k){ return k+'='+encodeURIComponent(params[k]); }).join('&');
  var url = APPS_SCRIPT_URL + '?' + qs;
  var resp = await fetch(url);
  return await resp.json();
}

async function cargarDatos() {
  if (!APPS_SCRIPT_URL) return;
  document.getElementById('panel-body').innerHTML =
    '<div class="loading"><div class="spinner"></div><p style="margin-top:12px;font-size:14px;color:#888">Cargando pedidos...</p></div>';
  try {
    var data = await apiCall('obtenerPedidosHoy');
    if (data.ok) {
      todosLosPedidos = data.pedidos || [];
      actualizarStats();
      renderPanel();
    } else {
      mostrarError('Error: ' + (data.error || 'desconocido'));
    }
  } catch(e) {
    mostrarError('No se pudo conectar con Apps Script. Verificá la URL y los permisos CORS.');
  }
}

function actualizarStats() {
  var total = todosLosPedidos.length;
  var pend  = todosLosPedidos.filter(function(p){ return p.estado==='Pendiente'; }).length;
  var proc  = todosLosPedidos.filter(function(p){ return p.estado==='Procesado'; }).length;
  var env   = todosLosPedidos.filter(function(p){ return p.estado==='Enviado'; }).length;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-pend').textContent  = pend;
  document.getElementById('stat-proc').textContent  = proc;
  document.getElementById('stat-env').textContent   = env;
}

function filtrarPedidos() {
  var suc    = document.getElementById('filtro-suc').value;
  var tipo   = document.getElementById('filtro-tipo').value;
  var estado = document.getElementById('filtro-estado').value;
  var cod    = document.getElementById('filtro-cod').value.trim().toUpperCase();
  return todosLosPedidos.filter(function(p) {
    if (suc    && p.sucursal !== suc)     return false;
    if (tipo   && p.tipo !== tipo)         return false;
    if (estado && p.estado !== estado)     return false;
    if (cod    && p.cod.indexOf(cod) < 0)  return false;
    return true;
  });
}

function renderPanel() {
  var pedidos = filtrarPedidos();
  var body = document.getElementById('panel-body');
  if (pedidos.length === 0) {
    body.innerHTML = '<div class="empty">📭 No hay artículos con esos filtros para hoy.</div>';
    return;
  }
  var grupos = {};
  SUCURSALES_ORDEN.forEach(function(s){ grupos[s] = []; });
  pedidos.forEach(function(p) {
    if (!grupos[p.sucursal]) grupos[p.sucursal] = [];
    grupos[p.sucursal].push(p);
  });

  var html = '';
  SUCURSALES_ORDEN.forEach(function(suc) {
    var lista = grupos[suc];
    if (!lista || lista.length === 0) return;
    var pend = lista.filter(function(p){ return p.estado==='Pendiente'; }).length;
    html += '<div class="suc-section">';
    html += '<div class="suc-header"><span class="suc-badge">'+suc+'</span>';
    html += '<span class="suc-counts">'+lista.length+' artículo'+(lista.length!==1?'s':'')+' · '+pend+' pendiente'+(pend!==1?'s':'')+'</span></div>';
    html += '<div class="table-wrap"><table>';
    html += '<thead><tr><th>Hora</th><th>Tipo</th><th>COD</th><th>Talle</th><th>Color</th><th>Cant.</th><th>Observación</th><th>Encargado</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>';
    lista.forEach(function(p) {
      var uid = p.id+'__'+p.cod+'__'+p.talle;
      html += '<tr>';
      html += '<td class="hora">'+p.hora+'</td>';
      html += '<td><span class="badge-tipo '+p.tipo+'">'+p.tipo+'</span></td>';
      html += '<td><span class="cod">'+p.cod+'</span></td>';
      html += '<td>'+(p.talle||'—')+'</td>';
      html += '<td>'+(p.color||'—')+'</td>';
      html += '<td style="font-weight:600">'+p.cantidad+'</td>';
      html += '<td class="encargado" style="font-style:italic;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+(p.obs||'')+'">'+( p.obs ? p.obs : '<span style="color:#ccc">—</span>' )+'</td>';
      html += '<td class="encargado">'+p.encargado+'</td>';
      html += '<td><span class="badge-estado '+p.estado+'" id="badge-'+btoa(uid).replace(/=/g,'')+'">'+p.estado+'</span></td>';
      html += '<td><div class="actions">';
      var bkey = btoa(uid).replace(/=/g,'');
      if (p.estado==='Pendiente') {
        html += '<button class="btn-accion proc" onclick="cambiarEstado(\''+p.id+'\',\''+p.cod+'\',\''+p.talle+'\',\'Procesado\',\''+bkey+'\')">✓ Procesar</button>';
        html += '<button class="btn-accion env"  onclick="cambiarEstado(\''+p.id+'\',\''+p.cod+'\',\''+p.talle+'\',\'Enviado\',\''+bkey+'\')">↗ Enviar</button>';
      } else if (p.estado==='Procesado') {
        html += '<button class="btn-accion env"  onclick="cambiarEstado(\''+p.id+'\',\''+p.cod+'\',\''+p.talle+'\',\'Enviado\',\''+bkey+'\')">↗ Enviar</button>';
      } else {
        html += '<span style="color:#aaa;font-size:12px">✓ Enviado</span>';
      }
      html += '</div></td></tr>';
    });
    html += '</tbody></table></div></div>';
  });
  body.innerHTML = html;
}

async function cambiarEstado(id, cod, talle, nuevoEstado, bkey) {
  var badge = document.getElementById('badge-'+bkey);
  if (badge) { badge.textContent='...'; badge.className='badge-estado'; }
  try {
    var data = await apiCall('actualizarEstado', { id:id, cod:cod, talle:talle, estado:nuevoEstado });
    if (data.ok) {
      todosLosPedidos.forEach(function(p) {
        if (p.id===id && p.cod===cod && p.talle===talle) p.estado=nuevoEstado;
      });
      actualizarStats();
      renderPanel();
      mostrarToast('Estado actualizado: ' + nuevoEstado, 'ok');
    } else {
      mostrarToast('Error: '+(data.error||'desconocido'), 'err');
    }
  } catch(e) {
    mostrarToast('Error de conexión', 'err');
  }
}

function mostrarToast(msg, tipo) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show '+(tipo||'');
  setTimeout(function(){ t.className='toast'; }, 3000);
}

function mostrarError(msg) {
  document.getElementById('panel-body').innerHTML='<div class="empty" style="color:#8B1A1A">⚠ '+msg+'</div>';
}
</script>
</body>
</html>
